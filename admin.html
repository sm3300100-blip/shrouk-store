<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم | إدارة المتجر والمظهر</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-hover: #059669;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --danger: #ef4444;
      --gold: #9e6f28;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }
    .container { max-width: 950px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
    .tabs-nav { display: flex; gap: 10px; margin-bottom: 25px; }
    .tab-btn { background: #e5e7eb; color: #4b5563; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 25px; }
    h2 { margin-bottom: 15px; font-size: 1.25rem; }
    .form-group { margin-bottom: 15px; }
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input, textarea { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input[type="color"] { height: 45px; padding: 4px; cursor: pointer; }
    input:focus, textarea:focus { border-color: var(--primary); }
    .file-input { padding: 6px; background: #fafafa; }
    .img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; margin-top: 8px; border: 1px solid #ccc; display: none; }
    button { background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: 0.2s; font-weight: 600; }
    button:hover { background-color: var(--primary-hover); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
    .product-item { background: var(--card-bg); border-radius: 10px; border: 1px solid #e5e7eb; overflow: hidden; display: flex; flex-direction: column; }
    .product-img { width: 100%; height: 160px; object-fit: cover; background: #e5e7eb; }
    .product-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; }
    .product-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
    .product-price { color: var(--primary); font-weight: bold; font-size: 1.1rem; margin-bottom: 8px; }
    .product-desc { font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; flex-grow: 1; }
    .btn-actions { display: flex; gap: 8px; align-self: flex-start; }
    .btn-edit { background-color: var(--blue); font-size: 0.85rem; padding: 6px 14px; }
    .btn-edit:hover { background-color: var(--blue-hover); }
    .btn-delete { background-color: var(--danger); font-size: 0.85rem; padding: 6px 14px; }
    .btn-delete:hover { background-color: #dc2626; }
    #login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .login-box { background: white; padding: 30px; border-radius: 12px; width: 100%; max-width: 350px; text-align: center; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 200; padding: 15px; }
    .modal-content { background: #ffffff; width: 100%; max-width: 500px; border-radius: 14px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
    .modal-close { background: none; border: none; font-size: 24px; color: #9ca3af; cursor: pointer; }
  </style>
</head>
<body>

  <div id="login-overlay">
    <div class="login-box">
      <h3 style="margin-bottom:15px;">تسجيل دخول المسؤول</h3>
      <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور" style="margin-bottom:15px;">
      <button onclick="checkAuth()" style="width:100%;">دخول</button>
      <p id="auth-error" style="color:red; font-size:0.85rem; margin-top:10px; display:none;">كلمة المرور غير صحيحة</p>
    </div>
  </div>

  <div class="container" id="admin-content" style="display:none;">
    <header>
      <h1>لوحة التحكم الشاملة</h1>
    </header>

    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('products-tab')">📦 إدارة المنتجات</button>
      <button class="tab-btn" onclick="switchTab('theme-tab')">🎨 إعدادات مظهر المتجر</button>
    </div>

    <!-- تبويب إدارة المنتجات -->
    <div id="products-tab" class="tab-content active">
      <div class="card">
        <h2>إضافة منتج جديد</h2>
        <form id="add-product-form">
          <div class="form-group">
            <label>اسم المنتج</label>
            <input type="text" id="p-name" required placeholder="مثال: زيت الأرجان الطبيعي">
          </div>
          <div class="form-group">
            <label>السعر (ج.م)</label>
            <input type="number" id="p-price" required placeholder="مثال: 120">
          </div>
          <div class="form-group">
            <label>اختر صورة من جهازك (أو الصق رابط)</label>
            <input type="file" id="p-file" accept="image/*" class="file-input" onchange="previewNewImage(this)">
            <input type="text" id="p-image" placeholder="أو مسار الصورة: images/enbat.jpeg" style="margin-top: 6px;">
            <img id="new-preview" class="img-preview" alt="معاينة الصورة">
          </div>
          <div class="form-group">
            <label>وصف المنتج</label>
            <textarea id="p-desc" rows="3" placeholder="اكتب تفاصيل المنتج..."></textarea>
          </div>
          <button type="submit" id="save-btn">إضافة المنتج إلى المتجر</button>
        </form>
      </div>

      <div class="card">
        <h2>المنتجات الحالية في لوحة التحكم</h2>
        <div class="grid" id="products-list">
          <p style="color:#6b7280;">جاري التحميل...</p>
        </div>
      </div>
    </div>

    <!-- تبويب إعدادات المظهر والواجهة -->
    <div id="theme-tab" class="tab-content">
      <div class="card">
        <h2>تخصيص الألوان والهوية</h2>
        <form id="theme-form">
          <div class="form-row">
            <div class="form-group">
              <label>اللون الأساسي (للأزرار والفوتر والهيدر):</label>
              <input type="color" id="theme-primary" value="#194837">
            </div>
            <div class="form-group">
              <label>اللون الثانوي (الذهبي / التمييز):</label>
              <input type="color" id="theme-gold" value="#9e6f28">
            </div>
            <div class="form-group">
              <label>لون خلفية الموقع بالكامل:</label>
              <input type="color" id="theme-bg" value="#faf7f2">
            </div>
          </div>

          <h2 style="margin-top: 25px;">نصوص الواجهة والبانر</h2>
          <div class="form-group">
            <label>نص الشريط الإعلاني العلوي:</label>
            <input type="text" id="theme-announcement" placeholder="🌿 خصومات حصرية على باقات العناية المتكاملة لفترة محدودة • 🚚 شحن لجميع محافظات مصر">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>العنوان الرئيسي - السطر الأول:</label>
              <input type="text" id="theme-title-1" placeholder="جمال طبيعي">
            </div>
            <div class="form-group">
              <label>العنوان الرئيسي - السطر الثاني:</label>
              <input type="text" id="theme-title-2" placeholder="بلمسة مصرية">
            </div>
          </div>
          <div class="form-group">
            <label>الوصف الترحيبي تحت العنوان:</label>
            <textarea id="theme-desc" rows="2" placeholder="اكتشفي أرقى منتجات العناية بالشعر الطبيعية 100%..."></textarea>
          </div>
          <div class="form-group">
            <label>خلفية قسم البانر (ارفع صورة جديدة من جهازك):</label>
            <input type="file" id="hero-file" accept="image/*" class="file-input" onchange="previewHeroImage(this)">
            <input type="text" id="theme-hero-bg" placeholder="رابط صورة الخلفية" style="margin-top: 6px;">
            <img id="hero-preview" class="img-preview" alt="معاينة الخلفية">
          </div>

          <button type="submit" id="save-theme-btn" style="background-color: var(--blue);">💾 حفظ وتطبيق المظهر فوراً على المتجر</button>
        </form>
      </div>
    </div>
  </div>

  <!-- نافذة تعديل المنتج -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>تعديل بيانات المنتج</h3>
        <button class="modal-close" onclick="closeEditModal()">&times;</button>
      </div>
      <form id="edit-product-form">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label>اسم المنتج</label>
          <input type="text" id="edit-name" required>
        </div>
        <div class="form-group">
          <label>السعر (ج.م)</label>
          <input type="number" id="edit-price" required>
        </div>
        <div class="form-group">
          <label>رفع صورة جديدة من جهازك:</label>
          <input type="file" id="edit-file" accept="image/*" class="file-input" onchange="previewEditImage(this)">
          <input type="text" id="edit-image" placeholder="رابط الصورة" style="margin-top: 6px;">
          <img id="edit-preview" class="img-preview" alt="معاينة الصورة">
        </div>
        <div class="form-group">
          <label>وصف المنتج</label>
          <textarea id="edit-desc" rows="3"></textarea>
        </div>
        <div style="display:flex; gap:10px;">
          <button type="submit" id="update-btn" style="background-color: var(--blue); flex:1;">حفظ التعديلات</button>
          <button type="button" onclick="closeEditModal()" style="background-color:#9ca3af;">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDR8aJ2Q27x7KESwV0LTEKJ38SyoptLWA0",
      authDomain: "natural-oils-ce42c.firebaseapp.com",
      projectId: "natural-oils-ce42c",
      storageBucket: "natural-oils-ce42c.firebasestorage.app",
      messagingSenderId: "1048327604490",
      appId: "1:1048327604490:web:8ef3b04d27d0750ea112f3",
      measurementId: "G-6M58J89NN3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const productsRef = collection(db, "products");
    const settingsDocRef = doc(db, "settings", "store_theme");

    let allProductsData = {};

    function fileToBase64(file, maxWidth = 600) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scaleSize = maxWidth / img.width;
            canvas.width = (img.width > maxWidth) ? maxWidth : img.width;
            canvas.height = (img.width > maxWidth) ? (img.height * scaleSize) : img.height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.75));
          };
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    window.previewNewImage = async function(input) {
      if (input.files && input.files[0]) {
        const base64 = await fileToBase64(input.files[0]);
        document.getElementById("p-image").value = base64;
        const preview = document.getElementById("new-preview");
        preview.src = base64;
        preview.style.display = "block";
      }
    };

    window.previewEditImage = async function(input) {
      if (input.files && input.files[0]) {
        const base64 = await fileToBase64(input.files[0]);
        document.getElementById("edit-image").value = base64;
        const preview = document.getElementById("edit-preview");
        preview.src = base64;
        preview.style.display = "block";
      }
    };

    window.previewHeroImage = async function(input) {
      if (input.files && input.files[0]) {
        const base64 = await fileToBase64(input.files[0], 900);
        document.getElementById("theme-hero-bg").value = base64;
        const preview = document.getElementById("hero-preview");
        preview.src = base64;
        preview.style.display = "block";
      }
    };

    // تبديل التبويبات
    window.switchTab = function(tabId) {
      document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
      document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
      document.getElementById(tabId).classList.add("active");
      event.target.classList.add("active");
    };

    // جلب وحفظ إعدادات المظهر
    async function loadThemeSettings() {
      const snap = await getDoc(settingsDocRef);
      if (snap.exists()) {
        const data = snap.data();
        if (data.primary) document.getElementById("theme-primary").value = data.primary;
        if (data.gold) document.getElementById("theme-gold").value = data.gold;
        if (data.bg) document.getElementById("theme-bg").value = data.bg;
        if (data.announcement) document.getElementById("theme-announcement").value = data.announcement;
        if (data.title1) document.getElementById("theme-title-1").value = data.title1;
        if (data.title2) document.getElementById("theme-title-2").value = data.title2;
        if (data.desc) document.getElementById("theme-desc").value = data.desc;
        if (data.heroBg) {
          document.getElementById("theme-hero-bg").value = data.heroBg;
          const prev = document.getElementById("hero-preview");
          prev.src = data.heroBg;
          prev.style.display = "block";
        }
      }
    }

    document.getElementById("theme-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("save-theme-btn");
      btn.disabled = true;
      btn.innerText = "جاري حفظ وتطبيق المظهر...";

      const themeData = {
        primary: document.getElementById("theme-primary").value,
        gold: document.getElementById("theme-gold").value,
        bg: document.getElementById("theme-bg").value,
        announcement: document.getElementById("theme-announcement").value,
        title1: document.getElementById("theme-title-1").value,
        title2: document.getElementById("theme-title-2").value,
        desc: document.getElementById("theme-desc").value,
        heroBg: document.getElementById("theme-hero-bg").value
      };

      await setDoc(settingsDocRef, themeData, { merge: true });
      btn.disabled = false;
      btn.innerText = "💾 حفظ وتطبيق المظهر فوراً على المتجر";
      alert("تم حفظ المظهر بنجاح، تم تطبيقه تلقائياً على المتجر!");
    });

    // المنتجات
    async function loadProducts() {
      const container = document.getElementById("products-list");
      container.innerHTML = "";
      const querySnapshot = await getDocs(productsRef);
      allProductsData = {};
      
      if (querySnapshot.empty) {
        container.innerHTML = "<p>لا توجد منتجات مضافة بعد.</p>";
        return;
      }

      querySnapshot.forEach((documentItem) => {
        const p = documentItem.data();
        const id = documentItem.id;
        allProductsData[id] = p;

        const div = document.createElement("div");
        div.className = "product-item";
        div.innerHTML = `
          <img src="${p.image}" class="product-img" alt="${p.name}">
          <div class="product-info">
            <div class="product-title">${p.name}</div>
            <div class="product-price">${p.price} ج.م</div>
            <div class="product-desc">${p.desc || ''}</div>
            <div class="btn-actions">
              <button class="btn-edit" onclick="openEditModal('${id}')">تعديل</button>
              <button class="btn-delete" onclick="removeProduct('${id}')">حذف</button>
            </div>
          </div>
        `;
        container.appendChild(div);
      });
    }

    window.openEditModal = function(id) {
      const prod = allProductsData[id];
      if (!prod) return;

      document.getElementById("edit-id").value = id;
      document.getElementById("edit-name").value = prod.name || "";
      document.getElementById("edit-price").value = prod.price || "";
      document.getElementById("edit-image").value = prod.image || "";
      document.getElementById("edit-desc").value = prod.desc || "";
      document.getElementById("edit-file").value = "";

      const preview = document.getElementById("edit-preview");
      if (prod.image) {
        preview.src = prod.image;
        preview.style.display = "block";
      } else {
        preview.style.display = "none";
      }

      document.getElementById("edit-modal").style.display = "flex";
    };

    window.closeEditModal = function() {
      document.getElementById("edit-modal").style.display = "none";
    };

    document.getElementById("edit-product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("edit-id").value;
      const updateBtn = document.getElementById("update-btn");
      updateBtn.disabled = true;
      updateBtn.innerText = "جاري الحفظ...";

      await updateDoc(doc(db, "products", id), {
        name: document.getElementById("edit-name").value,
        price: Number(document.getElementById("edit-price").value),
        image: document.getElementById("edit-image").value,
        desc: document.getElementById("edit-desc").value
      });

      updateBtn.disabled = false;
      updateBtn.innerText = "حفظ التعديلات";
      closeEditModal();
      loadProducts();
    });

    document.getElementById("add-product-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById("save-btn");
      saveBtn.disabled = true;
      saveBtn.innerText = "جاري الإضافة...";

      const newProduct = {
        name: document.getElementById("p-name").value,
        price: Number(document.getElementById("p-price").value),
        image: document.getElementById("p-image").value,
        desc: document.getElementById("p-desc").value,
        createdAt: new Date().toISOString()
      };

      await addDoc(productsRef, newProduct);
      document.getElementById("add-product-form").reset();
      document.getElementById("new-preview").style.display = "none";
      saveBtn.disabled = false;
      saveBtn.innerText = "إضافة المنتج إلى المتجر";
      loadProducts();
    });

    window.removeProduct = async function(id) {
      if (confirm("هل أنت متأكد من رغبتك في حذف هذا المنتج؟")) {
        await deleteDoc(doc(db, "products", id));
        loadProducts();
      }
    };

    window.loadAdminDashboard = function() {
      loadProducts();
      loadThemeSettings();
    };
  </script>

  <script>
    const ADMIN_PASSWORD = "admin123456";

    function checkAuth() {
      const pass = document.getElementById("admin-pass").value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById("login-overlay").style.display = "none";
        document.getElementById("admin-content").style.display = "block";
        window.loadAdminDashboard();
      } else {
        document.getElementById("auth-error").style.display = "block";
      }
    }
  </script>
</body>
</html>
